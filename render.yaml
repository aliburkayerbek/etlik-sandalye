# Render Blueprint: GitHub reposunu Render'a bağlayınca bu dosya servisi otomatik tanımlar.
services:
  - type: web
    name: etlik-sandalye
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon bağlantı adresini panelden girin
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false          # 64 hex, kendiniz üretip girin ve yedekleyin
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
